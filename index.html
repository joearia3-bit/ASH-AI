<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ASH AI - Turn what you have into income">
  <title>ASH AI v1</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #111827;
    }

    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 92% 6%, rgba(255, 222, 60, 0.95) 0, rgba(255, 222, 60, 0.0) 130px),
        linear-gradient(180deg, #bfeafc 0%, #7fd3f7 22%, #4dc3d6 52%, #2fb4a1 76%, #1c9a6a 100%);
      background-attachment: fixed;
      padding: 16px 14px 40px;
    }

    /* ---------- Decorative leaves ---------- */
    .leaf {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }
    .leaf-right {
      top: 690px;
      right: -30px;
      width: 260px;
      height: 90px;
      opacity: 0.55;
    }
    .leaf-left {
      bottom: 0;
      left: 0;
      width: 180px;
      height: 290px;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ---------- Header ---------- */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .logo {
      display: inline-block;
      background: #0b0b0b;
      color: #ffffff;
      font-weight: 900;
      font-size: 30px;
      letter-spacing: 1px;
      padding: 8px 22px 10px;
      border-radius: 14px;
      box-shadow: 0 5px 0 #000, 0 8px 14px rgba(0, 0, 0, 0.25);
    }
    .logo span { color: #ffc91f; }

    .badge {
      background: #22a84a;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 0 #14722f;
      margin-top: 8px;
    }

    .headline {
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      margin: 8px 0 6px;
      text-shadow: 0 2px 4px rgba(0, 60, 90, 0.35);
    }

    .subline {
      color: #0b1f2a;
      font-size: 16px;
      margin: 0 0 16px;
      font-weight: 500;
    }

    /* ---------- Cards ---------- */
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 6px 0 #d3e6f2, 0 12px 24px rgba(0, 40, 60, 0.18);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ---------- Colourful 3D buttons ---------- */
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 108px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      padding: 10px;
      text-align: center;
      transition: transform 0.05s ease;
    }
    .tile:active { transform: translateY(3px); }

    .tile .emoji { font-size: 34px; line-height: 1; }
